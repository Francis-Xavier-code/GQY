name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo check (app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps (alsa for rodio/cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # 仅校验应用本体（lib+bin）。注意：src 内联 #[cfg(test)] 单测当前不通过编译（test rot），
      # 故这里不传 --all-targets，避免把测试代码问题混进「应用能否编译」的门禁。
      - name: cargo check
        run: cargo check

  test:
    name: cargo test (surfaces broken inline tests)
    needs: check
    runs-on: ubuntu-latest
    continue-on-error: true   # 已知 src 内联单测不通过编译，先不阻断流水线，仅暴露问题
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps (alsa for rodio/cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: cargo test --no-run (编译单测，暴露 test rot)
        run: cargo test --no-run

  clippy:
    name: cargo clippy (report)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps (alsa for rodio/cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: clippy
      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: cargo clippy (report only)
        run: cargo clippy -- -W warnings
