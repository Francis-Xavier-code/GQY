# GQY 远程构建流水线（Woodpecker，局域网构建机 ~/gqy 上执行）
# 用法: woodpecker-cli exec --local --pipeline-event <push|tag>
#   push = 迭代（check + test），tag = 发布（release）
# target/ 在 ~/gqy 内持久存在，天然增量缓存。

steps:
  check:
    image: /bin/bash
    when: { event: [push, manual, tag] }
    commands:
      - export PATH="/home/xxy/.cargo/bin:$PATH" RUSTUP_HOME=/home/xxy/.rustup CARGO_HOME=/home/xxy/.cargo
      - cargo check --all-targets
  test:
    image: /bin/bash
    when: { event: [push, manual] }
    commands:
      - export PATH="/home/xxy/.cargo/bin:$PATH" RUSTUP_HOME=/home/xxy/.rustup CARGO_HOME=/home/xxy/.cargo
      - cargo test
      - cargo build
      - ./target/debug/gqy --version
  release:
    image: /bin/bash
    when: { event: [tag] }
    commands:
      - export PATH="/home/xxy/.cargo/bin:$PATH" RUSTUP_HOME=/home/xxy/.rustup CARGO_HOME=/home/xxy/.cargo
      - cargo build --release
      - ./target/release/gqy --version
